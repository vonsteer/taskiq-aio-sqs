name: SQS Emulator Benchmark

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      BENCHMARK_ITERATIONS: "40"
      BENCHMARK_STARTUP_TIMEOUT: "240"
      BENCHMARK_STARTUP_RETRIES: "2"
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - id: setup-uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Run emulator benchmark
        run: |
          uv run python scripts/benchmark_emulators.py \
            --iterations "${BENCHMARK_ITERATIONS}" \
            --startup-timeout "${BENCHMARK_STARTUP_TIMEOUT}" \
            --startup-retries "${BENCHMARK_STARTUP_RETRIES}" \
            --output benchmark_results.md \
            --json-output benchmark_results.json

      - name: Run full pytest suite per backend (Python 3.13)
        run: |
          set -euo pipefail

          wait_for_health() {
            local url="$1"
            local container="$2"
            local timeout_seconds="240"
            local start
            start=$(date +%s)

            while true; do
              if curl -fsS "$url" >/dev/null 2>&1; then
                return 0
              fi

              local state
              state=$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || echo "missing")
              if [ "$state" = "exited" ] || [ "$state" = "dead" ] || [ "$state" = "missing" ]; then
                return 1
              fi

              local now
              now=$(date +%s)
              if [ $((now - start)) -ge "$timeout_seconds" ]; then
                return 1
              fi

              sleep 1
            done
          }

          {
            echo "# Backend Full Test Suite Report"
            echo
            echo "Python: 3.13"
            echo
            echo "| Backend | Startup | Test Status | Duration (s) | Notes |"
            echo "|---|---:|---:|---:|---|"
          } > backend_test_results.md

          failures=0

          for backend in ministack localstack floci; do
            container="taskiq_tests_${backend}"
            log_file="backend-test-${backend}.log"

            image=""
            health_path=""
            env_args=()

            if [ "$backend" = "ministack" ]; then
              image="ministackorg/ministack:latest"
              health_path="/_ministack/health"
              env_args+=("-e" "AWS_DEFAULT_REGION=us-east-1")
              env_args+=("-e" "GATEWAY_PORT=4566")
              env_args+=("-e" "MINISTACK_ACCOUNT_ID=000000000000")
              env_args+=("-e" "MINISTACK_REGION=us-east-1")
              env_args+=("-e" "LOG_LEVEL=ERROR")
              env_args+=("-e" "PERSIST_STATE=0")
            elif [ "$backend" = "localstack" ]; then
              image="localstack/localstack:latest"
              health_path="/_localstack/health"
              env_args+=("-e" "SERVICES=sqs")
              env_args+=("-e" "ACTIVATE_PRO=0")
              env_args+=("-e" "DEFAULT_REGION=us-east-1")
              env_args+=("-e" "AWS_DEFAULT_REGION=us-east-1")
              env_args+=("-e" "DEBUG=0")
              if [ -n "${LOCALSTACK_AUTH_TOKEN:-}" ]; then
                env_args+=("-e" "LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}")
              fi
            else
              image="floci/floci:latest"
              health_path="/_localstack/health"
              env_args+=("-e" "FLOCI_DEFAULT_REGION=us-east-1")
              env_args+=("-e" "FLOCI_STORAGE_MODE=memory")
            fi

            docker rm -f "$container" >/dev/null 2>&1 || true
            docker run -d --name "$container" -p 4566:4566 "${env_args[@]}" "$image" >/dev/null

            startup_status="ok"
            test_status="not-run"
            duration_seconds="-"
            notes=""

            if wait_for_health "http://localhost:4566${health_path}" "$container"; then
              start_ts=$(date +%s)
              set +e
              uv run pytest > "$log_file" 2>&1
              exit_code=$?
              set -e
              end_ts=$(date +%s)
              duration_seconds=$((end_ts - start_ts))

              if [ "$exit_code" -eq 0 ]; then
                test_status="pass"
                notes="full suite passed"
              else
                test_status="fail"
                failures=$((failures + 1))
                summary_line=$(grep -E '=+ .* in [0-9.]+s =+' "$log_file" | tail -n 1 || true)
                if [ -n "$summary_line" ]; then
                  notes="$summary_line"
                else
                  notes="pytest failed; see ${log_file}"
                fi
              fi
            else
              startup_status="fail"
              test_status="not-run"
              failures=$((failures + 1))
              {
                echo "Startup failed for ${backend}"
                echo
                docker logs --tail 200 "$container" 2>&1 || true
              } > "$log_file"
              notes="startup failed; see ${log_file}"
            fi

            safe_notes=${notes//|/\\|}
            echo "| ${backend} | ${startup_status} | ${test_status} | ${duration_seconds} | ${safe_notes} |" >> backend_test_results.md

            docker rm -f "$container" >/dev/null 2>&1 || true
          done

          {
            echo
            if [ "$failures" -eq 0 ]; then
              echo "Overall: all backends passed full pytest suite."
            else
              echo "Overall: ${failures} backend(s) failed startup or tests."
            fi
          } >> backend_test_results.md

      - name: Add reports to workflow summary
        if: always()
        run: |
          {
            echo "## SQS Emulator Benchmark"
            echo
            cat benchmark_results.md
            echo
            echo "## Backend Full Test Suite (Python 3.13)"
            echo
            cat backend_test_results.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqs-emulator-benchmark
          path: |
            benchmark_results.md
            benchmark_results.json
            backend_test_results.md
            backend-test-*.log

      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          REPORT_PATH: benchmark_results.md
          TEST_REPORT_PATH: backend_test_results.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- sqs-emulator-benchmark-report -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const testReport = fs.readFileSync(process.env.TEST_REPORT_PATH, 'utf8');
            const body = [
              marker,
              '## SQS Emulator Benchmark (CI)',
              '',
              report,
              '',
              '## Backend Full Test Suite (Python 3.13)',
              '',
              testReport,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return comment.user.type === 'Bot' && comment.body.includes(marker);
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
              core.info(`Created benchmark comment: ${created.data.id}`);
            }
