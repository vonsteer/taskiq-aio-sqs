name: SQS Emulator Benchmark

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      BENCHMARK_ITERATIONS: "40"
      BENCHMARK_STARTUP_TIMEOUT: "240"
      BENCHMARK_STARTUP_RETRIES: "2"
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - id: setup-uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Run emulator benchmark
        run: |
          uv run python scripts/benchmark_emulators.py \
            --iterations "${BENCHMARK_ITERATIONS}" \
            --startup-timeout "${BENCHMARK_STARTUP_TIMEOUT}" \
            --startup-retries "${BENCHMARK_STARTUP_RETRIES}" \
            --output benchmark_results.md \
            --json-output benchmark_results.json

      - name: Add markdown report to workflow summary
        run: |
          {
            echo "## SQS Emulator Benchmark"
            echo
            cat benchmark_results.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqs-emulator-benchmark
          path: |
            benchmark_results.md
            benchmark_results.json

      - name: Post or update PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          REPORT_PATH: benchmark_results.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- sqs-emulator-benchmark-report -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = [
              marker,
              '## SQS Emulator Benchmark (CI)',
              '',
              report,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => {
              return comment.user.type === 'Bot' && comment.body.includes(marker);
            });

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated benchmark comment: ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
              core.info(`Created benchmark comment: ${created.data.id}`);
            }
